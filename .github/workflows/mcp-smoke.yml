name: American Superblock MCP
on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'app/public/**'
      - '.github/workflows/mcp-smoke.yml'
  push:
    branches: [main, feat/american-superblock-mcp]
    paths:
      - 'mcp/**'
      - 'app/public/**'
      - '.github/workflows/mcp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check server.mjs
      - run: node --check architecture.mjs
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TEST_IFC: '1'
          TEST_V2: '1'
