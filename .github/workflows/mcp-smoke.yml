name: American Superblock MCP
on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'app/public/**'
      - '.github/workflows/mcp-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'app/public/**'
      - '.github/workflows/mcp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: Protocol and geometry checks (no Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: for f in *.mjs; do node --check "$f" || exit 1; done
      - run: npm run test:fast
      - run: npm audit --audit-level=high
        continue-on-error: true
  browser:
    name: Actual Superblock browser integration
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TEST_IFC: '1'
          TEST_V2: '1'
          TEST_V3: '1'
          TEST_V4: '1'
          TEST_V5: '1'
